<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <nav>
        <h2>Student Registration Form</h2>
        <p>Student ID</p>
        <input type="text" placeholder="eg. 12-3456-789">
        <p>Student Fullname</p>
        <input type="text" placeholder="Enter your name">
        <br>


        <p>Email</p>
        <input type="email" placeholder="Enter your email here">
        <br>
        <input type="password" placeholder="Password">
        <br>


        <p>Gender:
            <br> <input type="checkbox"> Male
            <br> <input type="checkbox"> Female
        </p>

        <p>Course</p>
        <p>
            <input type="radio"> Web Tech
            <br> <input type="radio"> Net Sec
            <br> <input type="radio"> ERP
        </p>
        <hr>
        <h2>Hobbies</h2>
        <p> <input type="radio"> Reading <input type="radio"> Walking
            <br><input type="radio"> Cooking <input type="radio"> Drawing
            <br><input type="radio"> Drawing <input type="radio">Cycling
        </p>
        <input type="address" placeholder="Enter your address">
        <br>
        <br>
        <hr>
        <input type="Submit">


    </nav>
</body>

</html>
